name: Node.js Package [beta]

on: [push]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: contains(github.event.head_commit.message, '[beta]')
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22.14.x"
          registry-url: https://registry.npmjs.org/
      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@11
      - run: yarn prepublish-and-build
      - name: Validate version contains beta
        run: |
          version=$(jq -r .version package.json)
          echo $version | grep -q "\-beta"
      - run: npm publish --tag beta --provenance
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: latest